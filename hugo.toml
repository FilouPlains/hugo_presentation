languageCode = 'en-us'
title = '[HUGO] Presentations'
baseURL = "https://filouplains.github.io/hugo_presentation/"
relativeURLs = false
canonifyURLs = false

[markup]
    [markup.highlight]
    codeFences = false
    noClasses = true

    [markup.goldmark]
        [markup.goldmark.renderer]
        unsafe = true

        [markup.goldmark.parser]
            [markup.goldmark.parser.attribute]
            title = true
            block = true

        [markup.goldmark.extensions]
        passthrough = { enable = true, delimiters = { block = [['$$', '$$']], inline = [['$', '$']] } }
        typographer = true

        [markup.goldmark.extensions.extras]
            [markup.goldmark.extensions.extras.superscript]
                enable = true

[params]
theme = "white"
code_theme = "base16/nord"
math_engine = "MathJax3"
