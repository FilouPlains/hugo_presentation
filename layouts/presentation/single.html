<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{{ .Title }}</title>
        <link rel="stylesheet" href='{{ printf "reveal_js/plugin/highlight/theme/%s.css" ( .Params.code_theme | default .Site.Params.code_theme ) | relURL }}'>
        <link rel="stylesheet" href='{{ "reveal_js/reset.css" | relURL }}'>
        <link rel="stylesheet" href='{{ "reveal_js/reveal.css" | relURL }}'>
        <link rel="stylesheet" href='{{ printf "reveal_js/theme/%s.css" ( .Params.theme | default .Site.Params.theme ) | relURL }}'>

        {{ if .Page.HasShortcode "molstar" }}
        <link href="https://molstar.org/viewer/molstar.css" rel="stylesheet">
        <script type="text/javascript" src="https://molstar.org/viewer/molstar.js"></script>

        <style>
            .molstar-container {
                width: 100%;
                height: 15cm;
            }

            .msp-plugin {
                position: relative !important;
                width: 100% !important;
                height: 100% !important;
            }
            
            .msp-plugin,
            .msp-plugin .msp-viewport {
                background-color: #0000;
            }
            
            .msp-plugin .msp-layout-standard {
                border: none;
            }
            
            canvas {
                background: none !important;
            }
        </style>
        {{ end }}
    </head>

    <body>
        <div class="reveal">
            <div class="slides">
                <section data-markdown data-separator="<hr>$" data-separator-vertical="<p>===</p>$">
                    <textarea data-template>
                        {{ .Content }}
                    </textarea>
                </section>
            </div>
        </div>

        <script src='{{ "reveal_js/reveal.js" | relURL }}'></script>
        <script src='{{ "reveal_js/plugin/markdown/markdown.js" | relURL }}'></script>
        <script src='{{ "reveal_js/plugin/highlight/highlight.js" | relURL }}'></script>
        <script src='{{ "reveal_js/plugin/notes/notes.js" | relURL }}'></script>
        <script src='{{ "reveal_js/plugin/math/math.js" | relURL }}'></script>

        <script>
            Reveal.initialize({
                hash: true,
                history: true,
                width: 1080,
                height: 720,
                slideNumber: "c",
                minScale: 1,
                maxScale: 1,
                transition: '{{ .Params.transition | default "slide" }}',
                plugins: [
                    RevealMarkdown,
                    RevealHighlight,
                    RevealNotes,
                    {{ printf "RevealMath.%s" ( .Params.math_engine | default .Site.Params.math_engine ) | safeJS }}
                ]
            });

            Reveal.on("ready", event => {
                {{ with .Page.Store.Get "molstar_script_list" }}
                    {{ range $id, $js_content := . }}
                        {{ $js_content | safeJS }}
                    {{ end }}
                {{ end }}
            });
        </script>
    </body>
</html>
